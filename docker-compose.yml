services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Same loopback port host Nginx already proxies api.nexusagents.cloud to.
      - "127.0.0.1:5001:8001"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - dropforge_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dropforge_redis_data:/data

volumes:
  dropforge_mongo_data:
  dropforge_redis_data:
