services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Same loopback port host Nginx already proxies api.nexusagents.cloud to.
      - "127.0.0.1:5001:8001"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - dropforge_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dropforge_redis_data:/data

  # Daily mongodump into ./backups. Files are named by weekday, so the last 7 days are kept and each is overwritten
  # a week later (no cleanup job needed). The offsite service below copies them to R2.
  backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-dropforge}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/$${DB_NAME}-$$(date +%a).archive.gz
          mongodump --uri="mongodb://mongo:27017" --db="$$DB_NAME" --archive="$$f" --gzip && echo "backup ok: $$f"
          sleep 86400
        done
    depends_on:
      mongo:
        condition: service_healthy

  # Off-site copy of those dumps in Cloudflare R2 (does nothing until the R2_* variables are set in .env).
  offsite:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backups:/backups:ro
    command: ["python", "scripts/backup_to_r2.py", "--loop"]
    healthcheck:
      disable: true

volumes:
  dropforge_mongo_data:
  dropforge_redis_data:
