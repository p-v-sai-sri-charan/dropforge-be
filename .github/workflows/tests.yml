name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Every module compiles
        run: python -m compileall -q -x '(tests|tests_unit)/' .
      # in-process API tests against an in-memory Mongo (no server, database or secrets needed)
      - run: python -m pytest tests_unit
